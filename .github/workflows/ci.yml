name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'feat/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dart SDK check
        run: dart --version

      - name: SLICE-57 — sin nombres propios
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          patterns=$(grep -v '^\s*#' scripts/deny-person-names.txt | grep -v '^\s*$' | paste -sd '|' -)
          if rg -i -n "$patterns" . \
            -g '!.git/**' -g '!**/node_modules/**' -g '!**/.plugin_symlinks/**' -g '!**/ephemeral/**' -g '!**/build/**' -g '!scripts/deny-person-names.txt'; then
            echo "Nombres propios detectados (SLICE-57)" >&2
            exit 1
          fi

      - name: core — pub get and test
        working-directory: packages/core
        run: |
          dart pub get
          dart test

      - name: adapters — pub get and test
        working-directory: packages/adapters
        run: |
          dart pub get
          dart test

      - name: pos_app — pub get and test
        working-directory: apps/pos_app
        run: |
          flutter pub get
          flutter test

      - name: scanner_companion — pub get and test
        working-directory: apps/scanner_companion
        run: |
          flutter pub get
          flutter test