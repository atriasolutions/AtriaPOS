name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'feat/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dart SDK check
        run: dart --version

      - name: core — pub get and test
        working-directory: packages/core
        run: |
          dart pub get
          dart test

      - name: adapters — pub get and test
        working-directory: packages/adapters
        run: |
          dart pub get
          dart test

      - name: pos_app — pub get and test
        working-directory: apps/pos_app
        run: |
          flutter pub get
          flutter test

      - name: scanner_companion — pub get and test
        working-directory: apps/scanner_companion
        run: |
          flutter pub get
          flutter test