name: scanner_companion
description: Companion Android. Cámara nativa y envío al POS por la red local.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^6.0.2
  core:
    path: ../../packages/core
  flutter_ble_peripheral: ^3.2.0
  web_socket_channel: ^3.0.1
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  adapters:
    path: ../../packages/adapters

flutter:
  uses-material-design: true